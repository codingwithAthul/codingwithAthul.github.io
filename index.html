<style>
/* ============================================================
   TOKENS — see CONTEXT.md §8. Do not drift from these.
   Direction: alpine dawn. Cool light base, warm sunrise accent.
   ============================================================ */
:root{
  --snowfield:#EDF1F5;
  --whiteout:#FBFCFD;
  --pine:#17282E;
  --pine-soft:#4A5F68;
  --glacier:#2E7FA6;
  --firstlight:#FF6A3D;
  --alpenglow:#F5C453;
  --hair:rgba(23,40,46,.12);

  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;

  --gut:clamp(20px,5vw,72px);
  --maxw:1180px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--snowfield);
  color:var(--pine);
  font-family:var(--body);
  font-size:clamp(15px,1.05vw,17px);
  line-height:1.62;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
img,svg{max-width:100%;display:block}

/* painted dawn sky — always present, so the page is correct even if WebGL never loads */
.sky{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 70% at 62% 88%, rgba(255,106,61,.30) 0%, rgba(255,106,61,0) 58%),
    radial-gradient(90% 55% at 30% 92%, rgba(245,196,83,.34) 0%, rgba(245,196,83,0) 60%),
    linear-gradient(180deg,#CFE0EC 0%, #E3ECF3 42%, var(--snowfield) 78%, #F4F7FA 100%);
  transition:filter .6s linear;
}
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.1s ease .2s}
#scene.ready{opacity:1}

/* static fallback ridgeline for mobile / reduced-motion */
.ridge-fallback{position:fixed;left:0;right:0;bottom:0;z-index:-1;display:none;pointer-events:none}
.ridge-fallback.on{display:block}

/* ---------- altimeter rail : the structural device ---------- */
.altimeter{
  position:fixed;left:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);
  z-index:40;display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--pine-soft);
  mix-blend-mode:normal;
}
.altimeter .track{width:2px;height:min(46vh,340px);background:var(--hair);position:relative;border-radius:2px}
.altimeter .fill{position:absolute;top:0;left:0;width:100%;height:0;border-radius:2px;
  background:linear-gradient(180deg,var(--glacier),var(--firstlight));transition:height .12s linear}
.altimeter .dot{position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px;
  border-radius:50%;background:var(--firstlight);box-shadow:0 0 0 4px rgba(255,106,61,.18);transition:top .12s linear}
.altimeter .val{font-variant-numeric:tabular-nums;color:var(--pine)}
.altimeter .cap{writing-mode:vertical-rl;opacity:.55;text-transform:uppercase}

/* ---------- nav ---------- */
header.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--gut);
  backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(237,241,245,.82),rgba(237,241,245,0));
}
.mark{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
.mark b{color:var(--firstlight)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav a{text-decoration:none;color:var(--pine-soft);transition:color .2s}
.nav a:hover,.nav a:focus-visible{color:var(--firstlight)}

/* ---------- layout ---------- */
main{position:relative;z-index:1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
section{padding:clamp(84px,13vh,180px) 0}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--glacier);display:flex;align-items:center;gap:10px;margin:0 0 20px
}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--hair);max-width:120px}

h1{
  font-family:var(--display);
  font-size:clamp(50px,10.5vw,148px);
  font-variation-settings:"wdth" 100,"wght" 650;
  line-height:.88;letter-spacing:-.035em;margin:0 0 26px;
  text-wrap:balance;
}
h2{
  font-family:var(--display);
  font-size:clamp(30px,4.4vw,58px);
  font-variation-settings:"wdth" 96,"wght" 620;
  line-height:1.02;letter-spacing:-.025em;margin:0 0 14px;
}
h3{font-family:var(--display);font-variation-settings:"wdth" 92,"wght" 620;
  font-size:clamp(19px,1.5vw,23px);line-height:1.18;letter-spacing:-.015em;margin:0 0 8px}
.lede{font-size:clamp(17px,1.5vw,22px);line-height:1.5;color:var(--pine-soft);max-width:56ch;margin:0 0 34px}
p{margin:0 0 14px}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:clamp(60px,10vh,120px);padding-top:120px}
.hero .lede strong{color:var(--pine);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:13px 20px;border-radius:2px;border:1px solid transparent;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,color .22s,border-color .22s;
}
.btn-solid{background:var(--pine);color:var(--snowfield)}
.btn-solid:hover,.btn-solid:focus-visible{background:var(--firstlight);transform:translateY(-2px)}
.btn-ghost{border-color:var(--hair);color:var(--pine)}
.btn-ghost:hover,.btn-ghost:focus-visible{border-color:var(--pine);transform:translateY(-2px)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin:0 0 30px;
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--pine-soft)}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--firstlight);flex:none}
.pip.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.scrollcue{margin-top:44px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--pine-soft);display:flex;align-items:center;gap:10px}
.scrollcue i{display:block;width:1px;height:34px;background:linear-gradient(180deg,var(--pine-soft),transparent);
  animation:drop 2.2s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}
  50.1%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(.2);transform-origin:bottom}}

/* ---------- work grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;
  background:var(--hair);border:1px solid var(--hair);border-radius:3px;overflow:hidden}
.card{
  display:flex;flex-direction:column;gap:12px;text-decoration:none;
  background:var(--whiteout);padding:clamp(22px,2.4vw,32px);
  transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1);
  position:relative;isolation:isolate;
}
.card:hover,.card:focus-visible{background:#fff;transform:translateY(-3px)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--firstlight);transform:scaleX(0);transform-origin:left;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.card:hover::after,.card:focus-visible::after{transform:scaleX(1)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pine-soft)}
.card .arrow{font-family:var(--mono);font-size:14px;color:var(--glacier);transition:transform .3s}
.card:hover .arrow{transform:translate(3px,-3px)}
.card p{color:var(--pine-soft);font-size:.95em;margin:0}
.metric{font-family:var(--mono);font-size:12px;color:var(--pine);
  padding:7px 0 0;border-top:1px solid var(--hair);margin-top:auto;display:flex;gap:8px;align-items:baseline}
.metric b{font-size:19px;font-weight:500;color:var(--firstlight);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  padding:3px 8px;border-radius:2px;background:rgba(46,127,166,.09);color:var(--glacier)}
.card.locked{cursor:default}
.card.locked .arrow{color:var(--pine-soft);opacity:.5}
.card.locked:hover{transform:none;background:var(--whiteout)}
.card.locked::after{display:none}

/* ---------- track record ---------- */
.band{background:var(--pine);color:var(--snowfield);position:relative;z-index:1}
.band .eyebrow{color:var(--alpenglow)}
.band .eyebrow::after{background:rgba(255,255,255,.16)}
.band h2{color:#fff}
.band .lede{color:rgba(237,241,245,.68)}
.roles{border-top:1px solid rgba(255,255,255,.14)}
.role{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(14px,3vw,50px);
  padding:clamp(24px,3vw,38px) 0;border-bottom:1px solid rgba(255,255,255,.14)}
.role .when{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--alpenglow);margin:0 0 6px}
.role h3{color:#fff;margin-bottom:4px}
.role .org{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:rgba(237,241,245,.6);margin:0}
.role ul{margin:0;padding-left:17px;color:rgba(237,241,245,.78)}
.role li{margin-bottom:8px}
.role li::marker{color:var(--firstlight)}
.role li b{color:#fff;font-weight:600}
