<style>
/* ============================================================
   TOKENS — see CONTEXT.md §8. Do not drift from these.
   Direction: alpine dawn. Cool light base, warm sunrise accent.
   ============================================================ */
:root{
  --snowfield:#EDF1F5;
  --whiteout:#FBFCFD;
  --pine:#17282E;
  --pine-soft:#4A5F68;
  --glacier:#2E7FA6;
  --firstlight:#FF6A3D;
  --alpenglow:#F5C453;
  --hair:rgba(23,40,46,.12);

  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;

  --gut:clamp(20px,5vw,72px);
  --maxw:1180px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--snowfield);
  color:var(--pine);
  font-family:var(--body);
  font-size:clamp(15px,1.05vw,17px);
  line-height:1.62;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
img,svg{max-width:100%;display:block}

/* painted dawn sky — always present, so the page is correct even if WebGL never loads */
.sky{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 70% at 62% 88%, rgba(255,106,61,.30) 0%, rgba(255,106,61,0) 58%),
    radial-gradient(90% 55% at 30% 92%, rgba(245,196,83,.34) 0%, rgba(245,196,83,0) 60%),
    linear-gradient(180deg,#CFE0EC 0%, #E3ECF3 42%, var(--snowfield) 78%, #F4F7FA 100%);
  transition:filter .6s linear;
}
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.1s ease .2s}
#scene.ready{opacity:1}

/* static fallback ridgeline for mobile / reduced-motion */
.ridge-fallback{position:fixed;left:0;right:0;bottom:0;z-index:-1;display:none;pointer-events:none}
.ridge-fallback.on{display:block}

/* ---------- altimeter rail : the structural device ---------- */
.altimeter{
  position:fixed;left:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);
  z-index:40;display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--pine-soft);
  mix-blend-mode:normal;
}
.altimeter .track{width:2px;height:min(46vh,340px);background:var(--hair);position:relative;border-radius:2px}
.altimeter .fill{position:absolute;top:0;left:0;width:100%;height:0;border-radius:2px;
  background:linear-gradient(180deg,var(--glacier),var(--firstlight));transition:height .12s linear}
.altimeter .dot{position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px;
  border-radius:50%;background:var(--firstlight);box-shadow:0 0 0 4px rgba(255,106,61,.18);transition:top .12s linear}
.altimeter .val{font-variant-numeric:tabular-nums;color:var(--pine)}
.altimeter .cap{writing-mode:vertical-rl;opacity:.55;text-transform:uppercase}

/* ---------- nav ---------- */
header.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--gut);
  backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(237,241,245,.82),rgba(237,241,245,0));
}
.mark{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
.mark b{color:var(--firstlight)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav a{text-decoration:none;color:var(--pine-soft);transition:color .2s}
.nav a:hover,.nav a:focus-visible{color:var(--firstlight)}
